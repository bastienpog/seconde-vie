services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seconde_vie_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seconde_vie_backend
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-mysql://seconde_vie:seconde_vie_password@database:3306/seconde_vie?serverVersion=8.0.32&charset=utf8mb4}
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: seconde_vie_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_started

  database:
    image: mysql:8.0
    container_name: seconde_vie_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seconde_vie}
      MYSQL_USER: ${MYSQL_USER:-seconde_vie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-seconde_vie_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: seconde_vie_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_USER: ${MYSQL_USER:-seconde_vie}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-seconde_vie_password}
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
  frontend_node_modules:
  backend_vendor:
